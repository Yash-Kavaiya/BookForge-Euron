[project]
name = "bookforge"
version = "0.2.0"
description = "Multi-agent AI book generator powered by the Euron EURI API (web app + Google ADK YouTube pipeline)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yash Kavaiya" }]
# Core = the lean, Vercel-ready web app. Keep this list small: it is what
# Vercel installs into the serverless bundle.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Full YouTube-channel -> LaTeX book pipeline on Google ADK (local / container).
pipeline = [
    "google-adk>=1.5,<3",
    "openai>=1.40",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "matplotlib>=3.8",
]
# Optional tracing for the ADK pipeline.
observability = [
    "mlflow>=3.6.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "langfuse>=2.15",
]
lint = ["ruff>=0.8", "codespell>=2.3", "ty>=0.0.1a5"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "uvicorn[standard]>=0.30"]

[project.scripts]
bookforge = "bookforge.main:cli_entry"

[project.urls]
Homepage = "https://github.com/Yash-Kavaiya/BookForge-Euron"
Source = "https://github.com/Yash-Kavaiya/BookForge-Euron"
"Ported from" = "https://github.com/Yash-Kavaiya/BookForge-Google-ADK"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bookforge*"]

[tool.setuptools.package-data]
"bookforge.web" = ["static/*"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.codespell]
# Skip generated pipeline output (workspace artifacts contain compressed PDF streams).
skip = "./data,data,.venv,*.pdf,uv.lock"

[tool.ty.src]
include = ["bookforge", "tests"]

# ADK agents and matplotlib Text expose dynamic attributes that static
# analysis cannot see; these rules stay off project-wide.
[tool.ty.rules]
unknown-argument = "ignore"      # pydantic extra=allow on ADK BaseAgent subclasses
unresolved-attribute = "ignore"  # dynamic attrs: Session.state, Text.set_ha, LlmAgent.tools
deprecated = "ignore"
